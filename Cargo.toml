[package]
name = "jagad-shalawat"
version = "0.1.0"
edition = "2021"
description = "Ultra-fast blog engine for jagadshalawat.org — Rust + MariaDB + Redis"
authors = ["Jagad Shalawat Team"]

[dependencies]
# Web framework
actix-web = "4"
actix-files = "0.6"
actix-session = { version = "0.10", features = ["cookie-session"] }
actix-rt = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database (MariaDB/MySQL)
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono", "json"] }

# Cache (Redis)
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Templating
tera = "1"

# Markdown → HTML
comrak = "0.28"

# HTML sanitizer (for comments)
ammonia = "4"

# Image processing
image = "0.25"

# Password hashing
argon2 = "0.5"

# OAuth2
oauth2 = "4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# SEO / URL
slug = "0.1"
chrono = { version = "0.4", features = ["serde"] }
url = "2"

# Utilities
dotenvy = "0.15"
env_logger = "0.11"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
md-5 = "0.10"
hex = "0.4"
mime_guess = "2"
actix-multipart = "0.7"
futures-util = "0.3"
urlencoding = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
