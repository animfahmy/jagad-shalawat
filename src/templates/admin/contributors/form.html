{% extends "admin/layout.html" %}

{% block page_title %}{% if user %}Edit Kontributor{% else %}Tambah Kontributor{% endif %}{% endblock %}

{% block admin_content %}
<div class="card max-w-2xl mx-auto">
    <div class="card-header">
        {% if user %}Edit Kontributor: {{ user.username }}{% else %}Tambah Kontributor Baru{% endif %}
    </div>
    <div class="card-body">
        <form action="{% if user %}/blog/admin/contributors/{{ user.id }}{% else %}/blog/admin/contributors{% endif %}" method="POST">
            
            <div class="form-group mb-4">
                <label class="form-label" style="display:block; margin-bottom:0.5rem; font-weight:500;">Username</label>
                <input type="text" name="username" class="form-control" style="width:100%; padding:0.5rem; border:1px solid #d1d5db; border-radius:0.375rem;" value="{{ user.username | default(value='') }}" required>
            </div>
            
            <div class="form-group mb-4">
                <label class="form-label" style="display:block; margin-bottom:0.5rem; font-weight:500;">Email</label>
                <input type="email" name="email" class="form-control" style="width:100%; padding:0.5rem; border:1px solid #d1d5db; border-radius:0.375rem;" value="{{ user.email | default(value='') }}" required>
            </div>
            
            <div class="form-group mb-4">
                <label class="form-label" style="display:block; margin-bottom:0.5rem; font-weight:500;">Nama Tampil (Ditampilkan di artikel)</label>
                <input type="text" name="display_name" class="form-control" style="width:100%; padding:0.5rem; border:1px solid #d1d5db; border-radius:0.375rem;" value="{{ user.display_name | default(value='') }}" required>
            </div>
            
            <div class="form-group mb-4">
                <label class="form-label" style="display:block; margin-bottom:0.5rem; font-weight:500;">Password {% if user %}(Biarkan kosong jika tidak ingin mengubah){% endif %}</label>
                <input type="password" name="password" class="form-control" style="width:100%; padding:0.5rem; border:1px solid #d1d5db; border-radius:0.375rem;" {% if not user %}required{% endif %}>
            </div>
            
            <div class="form-group mb-4">
                <label class="form-label" style="display:flex; align-items:center; gap:0.5rem; font-weight:500;">
                    <input type="checkbox" name="is_active" {% if not user or user.is_active == 1 %}checked{% endif %}>
                    Aktif (Uncheck untuk Suspend)
                </label>
            </div>
            
            <div class="form-actions mt-6 flex gap-4">
                <button type="submit" class="btn btn-primary px-6">Simpan</button>
                <a href="/blog/admin/contributors" class="btn btn-outline">Batal</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
