<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - Jagad Shalawat</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f3f4f6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: #fff; padding: 2rem; border-radius: 0.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .login-card h1 { margin-top: 0; font-size: 1.5rem; text-align: center; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.875rem; }
        .form-control { width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 0.375rem; box-sizing: border-box; }
        .btn-primary { width: 100%; padding: 0.5rem; background: #0d9488; color: #fff; border: none; border-radius: 0.375rem; font-weight: 500; cursor: pointer; margin-top: 1rem; }
        .btn-primary:hover { background: #0f766e; }
        .alert { padding: 0.75rem; border-radius: 0.375rem; margin-bottom: 1rem; font-size: 0.875rem; }
        .alert-success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .text-center { text-align: center; }
        .mt-4 { margin-top: 1rem; }
        a { color: #0d9488; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Lupa Password</h1>
        
        {% if success_msg %}
        <div class="alert alert-success">{{ success_msg }}</div>
        {% endif %}
        
        <form action="/blog/admin/forgot-password" method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" required placeholder="Masukkan email akun Anda">
            </div>
            
            <button type="submit" class="btn-primary">Kirim Link Reset</button>
        </form>
        
        <div class="text-center mt-4" style="font-size: 0.875rem;">
            <a href="/blog/admin/login">Kembali ke halaman Login</a>
        </div>
    </div>
</body>
</html>
