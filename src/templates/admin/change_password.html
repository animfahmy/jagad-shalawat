{% extends "admin/layout.html" %}

{% block page_title %}Ganti Password{% endblock %}

{% block admin_content %}
<div class="card max-w-2xl mx-auto" style="max-width: 500px;">
    <div class="card-header">
        Ganti Password Anda
    </div>
    <div class="card-body">
        <form action="/blog/admin/change-password" method="POST">
            
            <div class="form-group mb-4" style="margin-bottom: 1.5rem;">
                <label class="form-label" style="display:block; margin-bottom:0.5rem; font-weight:500;">Password Baru</label>
                <input type="password" name="new_password" class="form-control" style="width:100%; padding:0.75rem; border:1px solid #d1d5db; border-radius:0.375rem;" required minlength="6" placeholder="Masukkan password baru">
            </div>
            
            <div class="form-group mb-4" style="margin-bottom: 1.5rem;">
                <label class="form-label" style="display:block; margin-bottom:0.5rem; font-weight:500;">Konfirmasi Password Baru</label>
                <input type="password" name="confirm_password" class="form-control" style="width:100%; padding:0.75rem; border:1px solid #d1d5db; border-radius:0.375rem;" required minlength="6" placeholder="Ketik ulang password baru">
            </div>
            
            <div class="form-actions mt-6" style="margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary px-6" style="width: 100%; padding: 0.75rem;">Simpan Password Baru</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
