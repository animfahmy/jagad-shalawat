<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Tagih Otomatis</title>
    <style>
        :root{--primary:#0d9488;--primary-dark:#0f766e;--bg:#f3f4f6;--text:#1f2937;--border:#e5e7eb;}
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        
        .login-card { background: #fff; width: 100%; max-width: 400px; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); padding: 2.5rem; text-align: center; }
        .login-card h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .login-card p { color: #6b7280; margin-bottom: 2rem; font-size: 0.875rem; }
        
        .form-group { margin-bottom: 1.25rem; text-align: left; }
        .form-group label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; }
        .form-control { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 0.375rem; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        .form-control:focus { border-color: var(--primary); }
        
        .btn-login { width: 100%; background: var(--primary); color: #fff; border: none; padding: 0.75rem; border-radius: 0.375rem; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 1rem; }
        .btn-login:hover { background: var(--primary-dark); }
        
        .error-msg { background: #fee2e2; color: #b91c1c; padding: 0.75rem; border-radius: 0.375rem; font-size: 0.875rem; margin-bottom: 1.5rem; display: {% if error %}block{% else %}none{% endif %}; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Admin Panel</h1>
        <p>Tagih Otomatis Blog Engine</p>
        
        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}
        
        <form action="/blog/admin/login" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn-login">Log In</button>
        </form>
    </div>
</body>
</html>
